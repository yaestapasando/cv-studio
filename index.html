<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Studio - Generador de CV</title>
    <style>
        /* Variables y Estilos Base */
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg-editor: #f8fafc;
            --bg-preview: #cbd5e1;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --white: #fff;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 10%), 0 4px 6px -4px rgb(0 0 0 / 10%);
            
            /* Tipografía y Espaciado CV */
            --cv-font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --cv-font-serif: 'Georgia', serif;
            --cv-spacing-sm: 0.5rem;
            --cv-spacing-md: 1rem;
            --cv-spacing-lg: 1.5rem;
            
            /* Dimensiones Hoja A4 */
            --a4-width: 210mm;
            --a4-height: 297mm;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--cv-font-sans);
            background-color: var(--bg-preview);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100%;
        }

        /* Paneles Principales */
        .editor-panel {
            flex: 0 0 40%;
            background: var(--bg-editor);
            overflow-y: auto;
            padding: 2rem;
            border-right: 1px solid #e2e8f0;
            z-index: 10;
        }

        .preview-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 3rem 1rem;
            background: var(--bg-preview);
            scroll-behavior: smooth;
        }

        /* Hoja de CV */
        #cv-paper {
            background: var(--white);
            width: 100%;
            max-width: var(--a4-width);
            min-height: var(--a4-height);
            aspect-ratio: 210 / 297;
            padding: 40px;
            box-shadow: var(--shadow);
            margin: 0 auto;
        }

        /* Diseño Responsive */
        @media (width <= 1024px) {
            #app {
                flex-direction: column;
                overflow-y: auto;
            }

            body {
                overflow: auto;
            }

            .editor-panel {
                flex: none;
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e2e8f0;
            }

            .preview-panel {
                padding: 1rem;
            }

            #cv-paper {
                width: 95%;
                min-height: auto;
                aspect-ratio: auto;
                padding: 20px;
            }
        }

        /* Estilos para impresión */
        @media print {
            .editor-panel {
                display: none;
            }

            .preview-panel {
                padding: 0;
                background: none;
                display: block;
            }

            #cv-paper {
                box-shadow: none;
                margin: 0;
                width: 100%;
            }

            body, #app {
                height: auto;
                overflow: visible;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <aside class="editor-panel">
            <h1>Configuración de CV</h1>
            <!-- Contenido del formulario en Feature 3 -->
        </aside>
        <main class="preview-panel">
            <div id="cv-paper">
                <!-- Vista previa en Feature 4 -->
            </div>
        </main>
    </div>

    <script>
        /**
         * CV Studio - Script Principal
         * Aplicación Single-File para generación de CVs.
         */
        (function() {
            'use strict';

            const CVStudio = {
                init: function() {
                    console.info('CV Studio: Inicializando aplicación...');
                    this.cacheDOM();
                    this.bindEvents();
                    this.state = this.createReactiveState({
                        personalData: {
                            firstName: '',
                            lastName: '',
                            email: '',
                            phone: '',
                            website: '',
                            location: '',
                            title: '',
                            linkedin: '',
                            github: ''
                        },
                        summary: '',
                        experience: [], // Array of objects: { id: string, company: string, position: string, location: string, startDate: string, endDate: string, current: boolean, description: string }
                        education: [],  // Array of objects: { id: string, institution: string, degree: string, field: string, location: string, startDate: string, endDate: string, current: boolean, description: string }
                        skills: []      // Array of strings: ['JavaScript', 'HTML', 'CSS']
                    });
                    this.render();
                },

                cacheDOM: function() {
                    this.app = document.getElementById('app');
                    this.preview = document.getElementById('cv-paper');
                },

                bindEvents: function() {
                    // Futuros manejadores de eventos
                },

                createReactiveState: function(initialState) {
                    const self = this;
                    const handler = {
                        get(target, key) {
                            const value = target[key];
                            if (typeof value === 'object' && value !== null) {
                                return new Proxy(value, handler);
                            }
                            return value;
                        },
                        set(target, key, value) {
                            target[key] = value;
                            self.render();
                            return true;
                        }
                    };
                    return new Proxy(initialState, handler);
                },

                render: function() {
                    console.debug('CV Studio: Renderizando vista previa...');
                    if (!this.preview) return;
                    
                    const { personalData } = this.state;
                    
                    // Renderizado básico para validar reactividad
                    this.preview.innerHTML = `
                        <div class="cv-header">
                            <h2>${personalData.firstName || 'Tu Nombre'} ${personalData.lastName || ''}</h2>
                            <p>${personalData.title || 'Tu Profesión'}</p>
                        </div>
                    `;
                },

                // Feature 2: Gestión del Estado
                state: null
            };

            // Iniciar aplicación al cargar el DOM
            document.addEventListener('DOMContentLoaded', () => {
                CVStudio.init();
            });
        })();
    </script>
</body>
</html>
