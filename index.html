<!DOCTYPE html>
<!--
  CV Studio v0.1.0 — 2026-03-12
  Aplicación SPA para crear, editar y exportar currículums vitae.
  Archivo único autocontenido: sin servidor, sin dependencias externas.
  Uso: abrir directamente en el navegador (file:// o servidor local).
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CV Studio — Crea tu currículum vitae de forma profesional, directamente en el navegador">
  <meta name="color-scheme" content="light dark">
  <title>CV Studio</title>
  <style>
    /* ── 1. Reset ─────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; tab-size: 4; }
    body { min-height: 100dvh; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    img, svg, video, canvas, audio, iframe, embed, object { display: block; max-width: 100%; }
    input, button, textarea, select { font: inherit; }
    p, h1, h2, h3, h4, h5, h6 { overflow-wrap: break-word; }
    ul, ol { list-style: none; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; }

    /* ── 2. CSS Variables ─────────────────────────────────────────────────────── */
    :root {
      /* Palette — Light */
      --color-bg:           #f5f5f5;
      --color-surface:      #ffffff;
      --color-surface-alt:  #f0f0f0;
      --color-border:       #d0d0d0;
      --color-text:         #1a1a1a;
      --color-text-muted:   #666666;
      --color-accent:       #2563eb;
      --color-accent-hover: #1d4ed8;
      --color-accent-text:  #ffffff;
      --color-danger:       #dc2626;

      /* Typography */
      --font-ui:        system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      --font-mono:      'Courier New', Courier, monospace;
      --font-size-sm:   0.875rem;
      --font-size-base: 1rem;
      --font-size-lg:   1.125rem;
      --font-size-xl:   1.25rem;

      /* Spacing */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;

      /* Layout */
      --header-height:  3.5rem;
      --status-height:  1.75rem;
      --panel-min-width: 320px;

      /* Decorative */
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.10);
      --shadow-md: 0 4px 12px rgba(0,0,0,.12);
      --transition: 150ms ease;
    }

    /* Dark theme — system preference */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg:           #111827;
        --color-surface:      #1f2937;
        --color-surface-alt:  #374151;
        --color-border:       #374151;
        --color-text:         #f9fafb;
        --color-text-muted:   #9ca3af;
        --color-accent:       #3b82f6;
        --color-accent-hover: #2563eb;
      }
    }

    /* Dark theme — manual toggle */
    [data-theme="dark"] {
      --color-bg:           #111827;
      --color-surface:      #1f2937;
      --color-surface-alt:  #374151;
      --color-border:       #374151;
      --color-text:         #f9fafb;
      --color-text-muted:   #9ca3af;
      --color-accent:       #3b82f6;
      --color-accent-hover: #2563eb;
    }

    /* Light theme — manual toggle */
    [data-theme="light"] {
      --color-bg:           #f5f5f5;
      --color-surface:      #ffffff;
      --color-surface-alt:  #f0f0f0;
      --color-border:       #d0d0d0;
      --color-text:         #1a1a1a;
      --color-text-muted:   #666666;
      --color-accent:       #2563eb;
      --color-accent-hover: #1d4ed8;
    }

    /* ── 3. Base ──────────────────────────────────────────────────────────────── */
    body {
      font-family: var(--font-ui);
      font-size: var(--font-size-base);
      color: var(--color-text);
      background: var(--color-bg);
    }

    /* ── 4. Layout ────────────────────────────────────────────────────────────── */

    /* App root */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* Header */
    #app-header {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      height: var(--header-height);
      padding: 0 var(--space-6);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
      z-index: 10;
    }

    #app-logo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-accent);
      white-space: nowrap;
    }

    #app-logo span:first-child {
      background: var(--color-accent);
      color: var(--color-accent-text);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      letter-spacing: 0.05em;
    }

    /* Toolbar */
    #app-toolbar {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-left: auto;
    }

    #app-toolbar button,
    #app-toolbar label[id^="btn-"] {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-2) var(--space-3);
      font-size: var(--font-size-sm);
      font-weight: 500;
      color: var(--color-text);
      background: var(--color-surface-alt);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), border-color var(--transition);
      user-select: none;
    }

    #app-toolbar button:hover,
    #app-toolbar label[id^="btn-"]:hover {
      background: var(--color-border);
    }

    #app-toolbar button:focus-visible,
    #app-toolbar label[id^="btn-"]:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    /* Status bar */
    #app-status {
      display: flex;
      align-items: center;
      height: var(--status-height);
      padding: 0 var(--space-6);
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    /* Main workspace */
    #app-workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* Editor panel */
    #editor-panel {
      display: flex;
      flex-direction: column;
      flex: 0 0 50%;
      min-width: var(--panel-min-width);
      overflow: hidden;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
    }

    /* Editor tabs */
    #editor-tabs {
      display: flex;
      gap: 1px;
      overflow-x: auto;
      background: var(--color-surface-alt);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
      scrollbar-width: thin;
    }

    #editor-tabs [role="tab"] {
      flex-shrink: 0;
      padding: var(--space-3) var(--space-4);
      font-size: var(--font-size-sm);
      font-weight: 500;
      color: var(--color-text-muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: color var(--transition), border-color var(--transition);
    }

    #editor-tabs [role="tab"]:hover { color: var(--color-text); }

    #editor-tabs [role="tab"][aria-selected="true"] {
      color: var(--color-accent);
      border-bottom-color: var(--color-accent);
      background: var(--color-surface);
    }

    #editor-tabs [role="tab"]:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: -2px;
    }

    /* Editor content */
    #editor-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-6);
    }

    #editor-content [role="tabpanel"] { display: block; }
    #editor-content [role="tabpanel"][hidden] { display: none; }

    /* Preview panel */
    #preview-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: var(--panel-min-width);
      overflow: hidden;
      background: var(--color-bg);
    }

    #preview-toolbar {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-6);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    #template-selector,
    #style-controls {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    #preview-frame {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-8);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* A4 page simulation */
    #preview-frame > * {
      width: 210mm;
      min-height: 297mm;
      background: var(--color-surface);
      box-shadow: var(--shadow-md);
      border-radius: var(--radius-sm);
    }

    /* ── 5. Editor form fields ───────────────────────────────────────────────── */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      margin-bottom: var(--space-4);
    }

    .field-group label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-text-muted);
    }

    .field-group input[type="text"] {
      padding: var(--space-2) var(--space-3);
      background: var(--color-bg);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 0.9375rem;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field-group input[type="text"]:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 20%, transparent);
    }

    #form-personal {
      padding: var(--space-4);
    }

    /* ── 6. Responsive ────────────────────────────────────────────────────────── */
    @media (max-width: 1024px) {
      #app-workspace { flex-direction: column; }
      #editor-panel,
      #preview-panel {
        flex: none;
        min-width: 0;
        width: 100%;
        height: 50%;
      }
      #editor-panel {
        border-right: none;
        border-bottom: 1px solid var(--color-border);
      }
    }

    /* ── 6. Reduced motion ────────────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    /* ── 7. Print ─────────────────────────────────────────────────────────────── */
    @media print {
      #app-header,
      #app-status,
      #editor-panel,
      #preview-toolbar { display: none !important; }
      #app-workspace { display: block; }
      #preview-panel { width: 100%; }
      #preview-frame { padding: 0; overflow: visible; }
    }
  </style>
</head>
<body>

  <div id="app" role="application" aria-label="CV Studio">

    <!-- ── Cabecera / Barra de herramientas ── -->
    <header id="app-header" role="banner">
      <div id="app-logo" aria-label="CV Studio">
        <span aria-hidden="true">CV</span>
        <span>Studio</span>
      </div>

      <nav id="app-toolbar" aria-label="Herramientas de la aplicación">
        <button id="btn-new"         type="button">Nuevo CV</button>
        <button id="btn-save"        type="button">Guardar</button>
        <button id="btn-export-pdf"  type="button">Descargar PDF</button>
        <button id="btn-export-json" type="button">Exportar JSON</button>
        <label  id="btn-import-json">
          Importar JSON
          <input id="input-import-json" type="file" accept=".json" hidden>
        </label>
        <button id="btn-copy-html"   type="button">Copiar HTML</button>
        <button id="btn-toggle-theme" type="button" aria-label="Cambiar tema claro/oscuro">Tema</button>
        <button id="btn-toggle-lang"  type="button" aria-label="Cambiar idioma de la interfaz">ES / EN</button>
      </nav>
    </header>

    <!-- ── Indicador de estado de guardado ── -->
    <div id="app-status" role="status" aria-live="polite" aria-atomic="true">
      <span id="status-text">Listo</span>
    </div>

    <!-- ── Área de trabajo principal ── -->
    <main id="app-workspace" role="main">

      <!-- Editor de CV -->
      <section id="editor-panel" aria-label="Editor de CV">

        <!-- Pestañas de navegación entre secciones -->
        <div id="editor-tabs" role="tablist" aria-label="Secciones del currículum">
          <button role="tab" id="tab-personal"       aria-selected="true"  aria-controls="section-personal">Datos personales</button>
          <button role="tab" id="tab-summary"        aria-selected="false" aria-controls="section-summary">Resumen</button>
          <button role="tab" id="tab-experience"     aria-selected="false" aria-controls="section-experience">Experiencia</button>
          <button role="tab" id="tab-education"      aria-selected="false" aria-controls="section-education">Educación</button>
          <button role="tab" id="tab-skills"         aria-selected="false" aria-controls="section-skills">Habilidades</button>
          <button role="tab" id="tab-languages"      aria-selected="false" aria-controls="section-languages">Idiomas</button>
          <button role="tab" id="tab-projects"       aria-selected="false" aria-controls="section-projects">Proyectos</button>
          <button role="tab" id="tab-certifications" aria-selected="false" aria-controls="section-certifications">Certificaciones</button>
          <button role="tab" id="tab-optional"       aria-selected="false" aria-controls="section-optional">Opcionales</button>
        </div>

        <!-- Paneles de contenido de cada sección -->
        <div id="editor-content">
          <section id="section-personal"       role="tabpanel" aria-labelledby="tab-personal">
            <form id="form-personal" novalidate>
              <div class="field-group">
                <label for="field-fullName">Nombre completo</label>
                <input type="text" id="field-fullName" name="fullName" autocomplete="name" maxlength="120" />
              </div>
              <div class="field-group">
                <label for="field-jobTitle">Título profesional / Puesto objetivo</label>
                <input type="text" id="field-jobTitle" name="jobTitle" autocomplete="organization-title" maxlength="120" />
              </div>
            </form>
          </section>
          <section id="section-summary"        role="tabpanel" aria-labelledby="tab-summary"        hidden>
            <!-- F-02 §2.2: Resumen profesional -->
          </section>
          <section id="section-experience"     role="tabpanel" aria-labelledby="tab-experience"     hidden>
            <!-- F-02 §2.3: Experiencia laboral -->
          </section>
          <section id="section-education"      role="tabpanel" aria-labelledby="tab-education"      hidden>
            <!-- F-02 §2.4: Educación -->
          </section>
          <section id="section-skills"         role="tabpanel" aria-labelledby="tab-skills"         hidden>
            <!-- F-02 §2.5: Habilidades -->
          </section>
          <section id="section-languages"      role="tabpanel" aria-labelledby="tab-languages"      hidden>
            <!-- F-02 §2.6: Idiomas -->
          </section>
          <section id="section-projects"       role="tabpanel" aria-labelledby="tab-projects"       hidden>
            <!-- F-02 §2.7: Proyectos personales / portfolio -->
          </section>
          <section id="section-certifications" role="tabpanel" aria-labelledby="tab-certifications" hidden>
            <!-- F-02 §2.8: Certificaciones y cursos -->
          </section>
          <section id="section-optional"       role="tabpanel" aria-labelledby="tab-optional"       hidden>
            <!-- F-02 §2.9: Secciones opcionales (voluntariado, publicaciones, etc.) -->
          </section>
        </div>

      </section><!-- /editor-panel -->

      <!-- Vista previa del CV -->
      <section id="preview-panel" aria-label="Vista previa del CV">

        <div id="preview-toolbar" aria-label="Controles de vista previa">
          <div id="template-selector" role="group" aria-label="Selector de plantilla">
            <!-- F-03: Miniaturas de plantillas (Classic, Modern, Minimal) -->
          </div>
          <div id="style-controls" role="group" aria-label="Opciones de estilo">
            <!-- F-03: Color de acento, tipografía, tamaño de fuente -->
          </div>
        </div>

        <div id="preview-frame" role="document" aria-label="Previsualización del currículum">
          <!-- F-04: El CV renderizado se actualiza en tiempo real aquí -->
        </div>

      </section><!-- /preview-panel -->

    </main><!-- /app-workspace -->

  </div><!-- /app -->

  <script>
    (function () {
      'use strict';

      // ── CV data model ─────────────────────────────────────────────────────────

      var DEFAULT_CV = {
        personal: {
          fullName:  '',
          jobTitle:  '',
          email:     '',
          phone:     '',
          location:  '',
          linkedIn:  '',
          website:   '',
          photo:     ''   // base64 data URL
        },
        summary: '',
        experience: [
          // { id, company, role, startDate, endDate, current, description }
        ],
        education: [
          // { id, institution, degree, field, startDate, endDate, current }
        ],
        skills: [
          // { id, name, level }  level: 'basic'|'intermediate'|'advanced'|'expert'
        ],
        languages: [
          // { id, name, level }  level: 'A1'|'A2'|'B1'|'B2'|'C1'|'C2'|string
        ],
        projects: [
          // { id, name, description, url, technologies }
        ],
        certifications: [
          // { id, name, issuer, date, url }
        ],
        optional: {
          volunteering:  { enabled: false, items: [] },
          publications:  { enabled: false, items: [] },
          awards:        { enabled: false, items: [] },
          references:    { enabled: false, text: '' }
        },
        meta: {
          template:     'classic',
          accentColor:  '#2563eb',
          fontPair:     'sans-serif',
          fontSize:     'normal',
          lang:         'es',
          theme:        'auto'
        }
      };

      // ── Reactive state store ──────────────────────────────────────────────────

      function createStore(initialState) {
        var _state     = JSON.parse(JSON.stringify(initialState));
        var _listeners = [];

        function getState() {
          return JSON.parse(JSON.stringify(_state));
        }

        function setState(updater) {
          var nextState;
          if (typeof updater === 'function') {
            nextState = updater(JSON.parse(JSON.stringify(_state)));
          } else if (updater !== null && typeof updater === 'object') {
            nextState = Object.assign(JSON.parse(JSON.stringify(_state)), updater);
          } else {
            return;
          }
          _state = nextState;
          var snapshot = JSON.parse(JSON.stringify(_state));
          _listeners.slice().forEach(function (fn) { fn(snapshot); });
        }

        function subscribe(fn) {
          if (typeof fn !== 'function') return function () {};
          _listeners.push(fn);
          return function () {
            _listeners = _listeners.filter(function (l) { return l !== fn; });
          };
        }

        function unsubscribe(fn) {
          _listeners = _listeners.filter(function (l) { return l !== fn; });
        }

        return { getState: getState, setState: setState, subscribe: subscribe, unsubscribe: unsubscribe };
      }

      var CVStore = createStore(DEFAULT_CV);

      // ── Tab navigation ────────────────────────────────────────────────────────

      function activateTab(name) {
        var tabs   = document.querySelectorAll('#editor-tabs [role="tab"]');
        var panels = document.querySelectorAll('#editor-content [role="tabpanel"]');

        tabs.forEach(function (t) { t.setAttribute('aria-selected', 'false'); });
        panels.forEach(function (p) { p.setAttribute('hidden', ''); });

        var tab   = document.getElementById('tab-'     + name);
        var panel = document.getElementById('section-' + name);
        if (tab)   tab.setAttribute('aria-selected', 'true');
        if (panel) panel.removeAttribute('hidden');
      }

      function initTabs() {
        var tablist = document.getElementById('editor-tabs');
        if (!tablist) return;

        tablist.addEventListener('click', function (e) {
          var tab = e.target.closest('[role="tab"]');
          if (!tab) return;
          activateTab(tab.id.replace('tab-', ''));
        });
      }

      // ── Template rendering engine ─────────────────────────────────────────────

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function render(cvData, opts) {
        var data   = cvData || {};
        var meta   = Object.assign({}, data.meta, opts);
        var tmpl   = meta.template    || 'classic';
        var accent = meta.accentColor || '#2563eb';
        var fonts  = meta.fontPair    || 'sans-serif';
        var fsMap  = { small: '13px', normal: '15px', large: '17px' };
        var fs     = fsMap[meta.fontSize] || fsMap.normal;
        var style  = 'style="--accent:' + escapeHtml(accent) + ';--font-pair:' + escapeHtml(fonts) + ';--font-size-base:' + fs + '"';

        if (tmpl === 'modern') return _renderModern(data, style);
        return _renderLinear(data, tmpl, style);
      }

      function _renderLinear(data, tmpl, style) {
        return '<div class="cv-doc cv-' + tmpl + '" ' + style + '>' +
          _buildHeader(data.personal || {}) +
          _buildAllSections(data) +
          '</div>';
      }

      function _renderModern(data, style) {
        var p = data.personal || {};
        var sidebar =
          '<aside class="cv-sidebar">' +
          (p.photo ? '<img class="cv-photo" src="' + escapeHtml(p.photo) + '" alt="Foto de perfil">' : '') +
          '<div class="cv-sidebar-name">' +
          (p.fullName  ? '<h1 class="cv-name">'      + escapeHtml(p.fullName)  + '</h1>' : '') +
          (p.jobTitle  ? '<p class="cv-job-title">'  + escapeHtml(p.jobTitle)  + '</p>'  : '') +
          '</div>' +
          _buildContactList(p) +
          (data.skills       && data.skills.length       ? _buildSection('Habilidades', _buildSkills(data.skills))           : '') +
          (data.languages    && data.languages.length    ? _buildSection('Idiomas',     _buildLanguages(data.languages))     : '') +
          (data.education    && data.education.length    ? _buildSection('Educación',   _buildEducation(data.education))     : '') +
          '</aside>';

        var main =
          '<div class="cv-main">' +
          (data.summary                                  ? _buildSection('Resumen profesional', _buildSummary(data.summary))           : '') +
          (data.experience    && data.experience.length  ? _buildSection('Experiencia laboral', _buildExperience(data.experience))    : '') +
          (data.projects      && data.projects.length    ? _buildSection('Proyectos',           _buildProjects(data.projects))        : '') +
          (data.certifications && data.certifications.length ? _buildSection('Certificaciones', _buildCertifications(data.certifications)) : '') +
          _buildOptionalSections(data.optional) +
          '</div>';

        return '<div class="cv-doc cv-modern" ' + style + '>' + sidebar + main + '</div>';
      }

      function _buildHeader(p) {
        return '<header class="cv-header">' +
          (p.photo ? '<img class="cv-photo" src="' + escapeHtml(p.photo) + '" alt="Foto de perfil">' : '') +
          '<div class="cv-header-text">' +
          (p.fullName ? '<h1 class="cv-name">'     + escapeHtml(p.fullName) + '</h1>' : '') +
          (p.jobTitle ? '<p class="cv-job-title">' + escapeHtml(p.jobTitle) + '</p>'  : '') +
          _buildContactList(p) +
          '</div>' +
          '</header>';
      }

      function _buildContactList(p) {
        var items = [];
        if (p.email)    items.push(escapeHtml(p.email));
        if (p.phone)    items.push(escapeHtml(p.phone));
        if (p.location) items.push(escapeHtml(p.location));
        if (p.linkedIn) items.push('<a href="' + escapeHtml(p.linkedIn) + '">' + escapeHtml(p.linkedIn) + '</a>');
        if (p.website)  items.push('<a href="' + escapeHtml(p.website)  + '">' + escapeHtml(p.website)  + '</a>');
        if (!items.length) return '';
        return '<ul class="cv-contacts">' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>';
      }

      function _buildAllSections(data) {
        return (data.summary                                       ? _buildSection('Resumen profesional', _buildSummary(data.summary))               : '') +
               (data.experience    && data.experience.length       ? _buildSection('Experiencia laboral', _buildExperience(data.experience))         : '') +
               (data.education     && data.education.length        ? _buildSection('Educación',           _buildEducation(data.education))           : '') +
               (data.skills        && data.skills.length           ? _buildSection('Habilidades',         _buildSkills(data.skills))                 : '') +
               (data.languages     && data.languages.length        ? _buildSection('Idiomas',             _buildLanguages(data.languages))           : '') +
               (data.projects      && data.projects.length         ? _buildSection('Proyectos',           _buildProjects(data.projects))             : '') +
               (data.certifications && data.certifications.length  ? _buildSection('Certificaciones',     _buildCertifications(data.certifications)) : '') +
               _buildOptionalSections(data.optional);
      }

      function _buildOptionalSections(optional) {
        if (!optional) return '';
        return (optional.volunteering && optional.volunteering.enabled && optional.volunteering.items.length ? _buildSection('Voluntariado', _buildListItems(optional.volunteering.items)) : '') +
               (optional.publications && optional.publications.enabled && optional.publications.items.length ? _buildSection('Publicaciones', _buildListItems(optional.publications.items)) : '') +
               (optional.awards       && optional.awards.enabled       && optional.awards.items.length       ? _buildSection('Premios',       _buildListItems(optional.awards.items))       : '') +
               (optional.references   && optional.references.enabled   && optional.references.text           ? _buildSection('Referencias',   '<p>' + escapeHtml(optional.references.text) + '</p>') : '');
      }

      function _buildSection(title, content) {
        return '<section class="cv-section"><h2 class="cv-section-title">' + escapeHtml(title) + '</h2>' +
               '<div class="cv-section-body">' + content + '</div></section>';
      }

      function _buildSummary(text) {
        return '<p class="cv-summary">' + escapeHtml(text) + '</p>';
      }

      function _buildExperience(items) {
        return items.map(function (item) {
          var dates = item.startDate
            ? escapeHtml(item.startDate) + ' – ' + (item.current ? 'Actualidad' : escapeHtml(item.endDate || ''))
            : '';
          return '<div class="cv-entry">' +
            '<div class="cv-entry-header">' +
            '<strong class="cv-entry-title">' + escapeHtml(item.role    || '') + '</strong>' +
            '<span class="cv-entry-org">'     + escapeHtml(item.company || '') + '</span>' +
            (dates ? '<span class="cv-entry-dates">' + dates + '</span>' : '') +
            '</div>' +
            (item.description ? '<p class="cv-entry-desc">' + escapeHtml(item.description) + '</p>' : '') +
            '</div>';
        }).join('');
      }

      function _buildEducation(items) {
        return items.map(function (item) {
          var title = escapeHtml(item.degree || '') + (item.field ? ', ' + escapeHtml(item.field) : '');
          var dates = item.startDate
            ? escapeHtml(item.startDate) + ' – ' + (item.current ? 'Actualidad' : escapeHtml(item.endDate || ''))
            : '';
          return '<div class="cv-entry">' +
            '<div class="cv-entry-header">' +
            '<strong class="cv-entry-title">' + title + '</strong>' +
            '<span class="cv-entry-org">' + escapeHtml(item.institution || '') + '</span>' +
            (dates ? '<span class="cv-entry-dates">' + dates + '</span>' : '') +
            '</div>' +
            '</div>';
        }).join('');
      }

      function _buildSkills(items) {
        return '<ul class="cv-skills-list">' +
          items.map(function (item) {
            return '<li class="cv-skill-item">' +
              '<span class="cv-skill-name">'  + escapeHtml(item.name  || '') + '</span>' +
              (item.level ? '<span class="cv-skill-level">' + escapeHtml(item.level) + '</span>' : '') +
              '</li>';
          }).join('') +
          '</ul>';
      }

      function _buildLanguages(items) {
        return '<ul class="cv-lang-list">' +
          items.map(function (item) {
            return '<li class="cv-lang-item">' +
              '<span class="cv-lang-name">'  + escapeHtml(item.name  || '') + '</span>' +
              (item.level ? '<span class="cv-lang-level">' + escapeHtml(item.level) + '</span>' : '') +
              '</li>';
          }).join('') +
          '</ul>';
      }

      function _buildProjects(items) {
        return items.map(function (item) {
          return '<div class="cv-entry">' +
            '<div class="cv-entry-header">' +
            '<strong class="cv-entry-title">' + escapeHtml(item.name || '') + '</strong>' +
            (item.url ? '<a class="cv-entry-url" href="' + escapeHtml(item.url) + '">' + escapeHtml(item.url) + '</a>' : '') +
            '</div>' +
            (item.description  ? '<p class="cv-entry-desc">' + escapeHtml(item.description)  + '</p>' : '') +
            (item.technologies ? '<p class="cv-entry-tech">' + escapeHtml(item.technologies) + '</p>' : '') +
            '</div>';
        }).join('');
      }

      function _buildCertifications(items) {
        return items.map(function (item) {
          return '<div class="cv-entry">' +
            '<div class="cv-entry-header">' +
            '<strong class="cv-entry-title">' + escapeHtml(item.name   || '') + '</strong>' +
            (item.issuer ? '<span class="cv-entry-org">'   + escapeHtml(item.issuer) + '</span>' : '') +
            (item.date   ? '<span class="cv-entry-dates">' + escapeHtml(item.date)   + '</span>' : '') +
            '</div>' +
            (item.url ? '<a class="cv-entry-url" href="' + escapeHtml(item.url) + '">' + escapeHtml(item.url) + '</a>' : '') +
            '</div>';
        }).join('');
      }

      function _buildListItems(items) {
        return '<ul class="cv-list">' +
          items.map(function (item) {
            var text = typeof item === 'string' ? item : (item.text || item.name || '');
            return '<li>' + escapeHtml(text) + '</li>';
          }).join('') +
          '</ul>';
      }

      // ── Event bus ─────────────────────────────────────────────────────────────

      function createEventBus() {
        var _handlers = {};

        function on(event, fn) {
          if (typeof fn !== 'function') return function () {};
          if (!_handlers[event]) _handlers[event] = [];
          _handlers[event].push(fn);
          return function () { off(event, fn); };
        }

        function off(event, fn) {
          if (!_handlers[event]) return;
          _handlers[event] = _handlers[event].filter(function (h) { return h !== fn; });
        }

        function emit(event, data) {
          if (!_handlers[event]) return;
          _handlers[event].slice().forEach(function (fn) { fn(data); });
        }

        function once(event, fn) {
          if (typeof fn !== 'function') return function () {};
          function wrapper(data) { off(event, wrapper); fn(data); }
          return on(event, wrapper);
        }

        return { on: on, off: off, emit: emit, once: once };
      }

      var EventBus = createEventBus();

      // ── Personal form bindings ────────────────────────────────────────────────

      function initPersonalFields() {
        var inputFullName = document.getElementById('field-fullName');
        var inputJobTitle = document.getElementById('field-jobTitle');

        // Store → fields (initial + reactive)
        function syncFromStore(state) {
          var p = state.personal || {};
          if (inputFullName && inputFullName.value !== (p.fullName || '')) inputFullName.value = p.fullName || '';
          if (inputJobTitle && inputJobTitle.value !== (p.jobTitle || '')) inputJobTitle.value = p.jobTitle || '';
        }
        syncFromStore(CVStore.getState());
        CVStore.subscribe(syncFromStore);

        // Fields → store
        if (inputFullName) {
          inputFullName.addEventListener('input', function () {
            CVStore.setState(function (s) {
              return Object.assign({}, s, { personal: Object.assign({}, s.personal, { fullName: inputFullName.value }) });
            });
          });
        }

        if (inputJobTitle) {
          inputJobTitle.addEventListener('input', function () {
            CVStore.setState(function (s) {
              return Object.assign({}, s, { personal: Object.assign({}, s.personal, { jobTitle: inputJobTitle.value }) });
            });
          });
        }
      }

      // ── Bootstrap ─────────────────────────────────────────────────────────────

      function init() {
        initTabs();
        initPersonalFields();
      }

      // Expose minimal public API (used by tests and future modules)
      window.CVStudio = { DEFAULT_CV: DEFAULT_CV, createStore: createStore, CVStore: CVStore, createEventBus: createEventBus, EventBus: EventBus, activateTab: activateTab, render: render, initPersonalFields: initPersonalFields, init: init };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>

</body>
