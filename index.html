<!DOCTYPE html>
<!--
  CV Studio v0.1.0 — 2026-03-12
  Aplicación SPA para crear, editar y exportar currículums vitae.
  Archivo único autocontenido: sin servidor, sin dependencias externas.
  Uso: abrir directamente en el navegador (file:// o servidor local).
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CV Studio — Crea tu currículum vitae de forma profesional, directamente en el navegador">
  <meta name="color-scheme" content="light dark">
  <title>CV Studio</title>
  <style>
    /* CSS will be added in a subsequent task */
  </style>
</head>
<body>

  <div id="app" role="application" aria-label="CV Studio">

    <!-- ── Cabecera / Barra de herramientas ── -->
    <header id="app-header" role="banner">
      <div id="app-logo" aria-label="CV Studio">
        <span aria-hidden="true">CV</span>
        <span>Studio</span>
      </div>

      <nav id="app-toolbar" aria-label="Herramientas de la aplicación">
        <button id="btn-new"         type="button">Nuevo CV</button>
        <button id="btn-save"        type="button">Guardar</button>
        <button id="btn-export-pdf"  type="button">Descargar PDF</button>
        <button id="btn-export-json" type="button">Exportar JSON</button>
        <label  id="btn-import-json">
          Importar JSON
          <input id="input-import-json" type="file" accept=".json" hidden>
        </label>
        <button id="btn-copy-html"   type="button">Copiar HTML</button>
        <button id="btn-toggle-theme" type="button" aria-label="Cambiar tema claro/oscuro">Tema</button>
        <button id="btn-toggle-lang"  type="button" aria-label="Cambiar idioma de la interfaz">ES / EN</button>
      </nav>
    </header>

    <!-- ── Indicador de estado de guardado ── -->
    <div id="app-status" role="status" aria-live="polite" aria-atomic="true">
      <span id="status-text">Listo</span>
    </div>

    <!-- ── Área de trabajo principal ── -->
    <main id="app-workspace" role="main">

      <!-- Editor de CV -->
      <section id="editor-panel" aria-label="Editor de CV">

        <!-- Pestañas de navegación entre secciones -->
        <div id="editor-tabs" role="tablist" aria-label="Secciones del currículum">
          <button role="tab" id="tab-personal"       aria-selected="true"  aria-controls="section-personal">Datos personales</button>
          <button role="tab" id="tab-summary"        aria-selected="false" aria-controls="section-summary">Resumen</button>
          <button role="tab" id="tab-experience"     aria-selected="false" aria-controls="section-experience">Experiencia</button>
          <button role="tab" id="tab-education"      aria-selected="false" aria-controls="section-education">Educación</button>
          <button role="tab" id="tab-skills"         aria-selected="false" aria-controls="section-skills">Habilidades</button>
          <button role="tab" id="tab-languages"      aria-selected="false" aria-controls="section-languages">Idiomas</button>
          <button role="tab" id="tab-projects"       aria-selected="false" aria-controls="section-projects">Proyectos</button>
          <button role="tab" id="tab-certifications" aria-selected="false" aria-controls="section-certifications">Certificaciones</button>
          <button role="tab" id="tab-optional"       aria-selected="false" aria-controls="section-optional">Opcionales</button>
        </div>

        <!-- Paneles de contenido de cada sección -->
        <div id="editor-content">
          <section id="section-personal"       role="tabpanel" aria-labelledby="tab-personal">
            <!-- F-02 §2.1: Datos personales — formulario se renderizará aquí -->
          </section>
          <section id="section-summary"        role="tabpanel" aria-labelledby="tab-summary"        hidden>
            <!-- F-02 §2.2: Resumen profesional -->
          </section>
          <section id="section-experience"     role="tabpanel" aria-labelledby="tab-experience"     hidden>
            <!-- F-02 §2.3: Experiencia laboral -->
          </section>
          <section id="section-education"      role="tabpanel" aria-labelledby="tab-education"      hidden>
            <!-- F-02 §2.4: Educación -->
          </section>
          <section id="section-skills"         role="tabpanel" aria-labelledby="tab-skills"         hidden>
            <!-- F-02 §2.5: Habilidades -->
          </section>
          <section id="section-languages"      role="tabpanel" aria-labelledby="tab-languages"      hidden>
            <!-- F-02 §2.6: Idiomas -->
          </section>
          <section id="section-projects"       role="tabpanel" aria-labelledby="tab-projects"       hidden>
            <!-- F-02 §2.7: Proyectos personales / portfolio -->
          </section>
          <section id="section-certifications" role="tabpanel" aria-labelledby="tab-certifications" hidden>
            <!-- F-02 §2.8: Certificaciones y cursos -->
          </section>
          <section id="section-optional"       role="tabpanel" aria-labelledby="tab-optional"       hidden>
            <!-- F-02 §2.9: Secciones opcionales (voluntariado, publicaciones, etc.) -->
          </section>
        </div>

      </section><!-- /editor-panel -->

      <!-- Vista previa del CV -->
      <section id="preview-panel" aria-label="Vista previa del CV">

        <div id="preview-toolbar" aria-label="Controles de vista previa">
          <div id="template-selector" role="group" aria-label="Selector de plantilla">
            <!-- F-03: Miniaturas de plantillas (Classic, Modern, Minimal) -->
          </div>
          <div id="style-controls" role="group" aria-label="Opciones de estilo">
            <!-- F-03: Color de acento, tipografía, tamaño de fuente -->
          </div>
        </div>

        <div id="preview-frame" role="document" aria-label="Previsualización del currículum">
          <!-- F-04: El CV renderizado se actualiza en tiempo real aquí -->
        </div>

      </section><!-- /preview-panel -->

    </main><!-- /app-workspace -->

  </div><!-- /app -->

  <script>
    // JavaScript will be added in a subsequent task
  </script>

</body>
</html>
