<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Studio - Generador de CV</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg-editor: #f8fafc;
            --bg-preview: #cbd5e1;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --white: #fff;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 10%), 0 4px 6px -4px rgb(0 0 0 / 10%);
            --cv-font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --cv-font-serif: 'Georgia', serif;
            --cv-spacing-sm: 0.5rem;
            --cv-spacing-md: 1rem;
            --cv-spacing-lg: 1.5rem;
            --a4-width: 210mm;
            --a4-height: 297mm;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--cv-font-sans);
            background-color: var(--bg-preview);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100%;
        }

        .editor-panel {
            flex: 0 0 40%;
            background: var(--bg-editor);
            overflow-y: auto;
            padding: 2rem;
            border-right: 1px solid #e2e8f0;
            z-index: 10;
        }

        .preview-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 3rem 1rem;
            background: var(--bg-preview);
            scroll-behavior: smooth;
        }

        #cv-paper {
            background: var(--white);
            width: 100%;
            max-width: var(--a4-width);
            min-height: var(--a4-height);
            padding: 20mm;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 10%), 0 8px 10px -6px rgb(0 0 0 / 10%);
            margin: 0 auto;
            position: relative;
        }

        @media (width <= 1024px) {
            #app {
                flex-direction: column;
                overflow-y: auto;
            }

            body {
                overflow: auto;
            }

            .editor-panel {
                flex: none;
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e2e8f0;
            }

            .preview-panel {
                padding: 1rem;
            }

            #cv-paper {
                width: 95%;
                min-height: auto;
                aspect-ratio: auto;
                padding: 20px;
            }
        }

        @media print {
            @page {
                size: a4;
                margin: 0;
            }

            html, body, #app {
                height: auto !important;
                overflow: visible !important;
                background: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .editor-panel {
                display: none !important;
            }

            .preview-panel {
                padding: 0;
                margin: 0;
                background: none;
                display: block;
                overflow: visible;
            }

            #cv-paper {
                box-shadow: none;
                margin: 0 auto;
                width: 100%;
                max-width: none;
                padding: 20mm;
            }

            .cv-grid {
                gap: 2rem;
            }
            
            .cv-header {
                border-bottom-width: 4px;
            }

            .cv-item {
                break-inside: avoid;
            }
        }

        .editor-panel h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .form-section {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .form-section h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-editor);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mb-0 { margin-bottom: 0 !important; }
        .mb-1 { margin-bottom: 1rem !important; }
        .mt-neg-sm { margin-top: -0.5rem !important; }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input {
            width: auto !important;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 20%);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            transition: all 0.2s;
            border: none;
        }

        .btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
        }

        .btn-full {
            width: 100%;
        }

        .experience-item {
            background: var(--bg-editor);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .experience-item-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.5rem;
        }

        .experience-item-controls {
            display: flex;
            gap: 0.5rem;
        }

        @media (width <= 640px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .cv-header {
            margin-bottom: 2rem;
            border-bottom: 4px solid var(--primary);
            padding-bottom: 1rem;
        }

        .cv-header h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .cv-header h1 strong {
            font-weight: 800;
        }

        .cv-title {
            font-size: 1.25rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cv-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .cv-section {
            margin-bottom: 1.5rem;
        }

        .cv-section-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cv-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .cv-item {
            margin-bottom: 1.25rem;
        }

        .cv-item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.15rem;
        }

        .cv-item-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .cv-item-subtitle {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
        }

        .cv-item-date {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .cv-item-description {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-main);
            white-space: pre-line;
        }

        .cv-summary {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
            white-space: pre-line;
            text-align: justify;
        }

        .cv-contact-list {
            list-style: none;
            padding: 0;
        }

        .cv-contact-list li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .cv-contact-icon {
            font-size: 1rem;
            width: 1.25rem;
            text-align: center;
        }

        .cv-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .cv-skill-tag {
            background-color: #f1f5f9;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: 600;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div id="app">
        <aside class="editor-panel">
            <div class="flex-between mb-1">
                <h1 class="mb-0">Configuración de CV</h1>
                <div class="flex-between" style="gap: 0.5rem;">
                    <button type="button" id="import-data" class="btn btn-primary btn-sm">Importar Datos</button>
                    <button type="button" id="export-data" class="btn btn-primary btn-sm">Exportar Datos</button>
                    <button type="button" id="export-pdf" class="btn btn-primary btn-sm">Exportar a PDF</button>
                    <input type="file" id="import-input" style="display: none;" accept=".json">
                </div>
            </div>
            <div class="form-section">
                <h2>Datos Personales</h2>
                <div class="form-group">
                    <label for="firstName">Nombre</label>
                    <input type="text" id="firstName" data-path="personalData.firstName" placeholder="Ej. Juan">
                </div>
                <div class="form-group">
                    <label for="lastName">Apellido</label>
                    <input type="text" id="lastName" data-path="personalData.lastName" placeholder="Ej. Pérez">
                </div>
                <div class="form-group">
                    <label for="title">Profesión</label>
                    <input type="text" id="title" data-path="personalData.title" placeholder="Ej. Desarrollador Fullstack">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" data-path="personalData.email" placeholder="Ej. juan.perez@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" data-path="personalData.phone" placeholder="Ej. +34 600 000 000">
                </div>
                <div class="form-group">
                    <label for="location">Ubicación</label>
                    <input type="text" id="location" data-path="personalData.location" placeholder="Ej. Madrid, España">
                </div>
                <div class="form-group">
                    <label for="linkedin">LinkedIn</label>
                    <input type="url" id="linkedin" data-path="personalData.linkedin" placeholder="Ej. linkedin.com/in/juanperez">
                </div>
                <div class="form-group">
                    <label for="github">GitHub</label>
                    <input type="url" id="github" data-path="personalData.github" placeholder="Ej. github.com/juanperez">
                </div>
                <div class="form-group">
                    <label for="website">Sitio Web</label>
                    <input type="url" id="website" data-path="personalData.website" placeholder="Ej. juanperez.dev">
                </div>
            </div>
            <div class="form-section">
                <h2>Extracto / Perfil Profesional</h2>
                <div class="form-group">
                    <label for="summary">Descripción</label>
                    <textarea id="summary" data-path="summary" placeholder="Breve descripción de tu perfil profesional, objetivos y logros principales..."></textarea>
                </div>
            </div>
            <div class="form-section">
                <h2>Habilidades</h2>
                <div class="form-group">
                    <label for="skills">Habilidades</label>
                    <input type="text" id="skills" data-path="skills" placeholder="Ej. JavaScript, React, Node.js (separadas por comas)">
                </div>
            </div>
            <div class="form-section">
                <div class="flex-between mb-1">
                    <h2 class="mb-0">Experiencia Laboral</h2>
                    <button type="button" id="add-experience" class="btn btn-primary btn-sm">+ Añadir</button>
                </div>
                <div id="experience-list">
                </div>
            </div>
            <div class="form-section">
                <div class="flex-between mb-1">
                    <h2 class="mb-0">Educación / Formación</h2>
                    <button type="button" id="add-education" class="btn btn-primary btn-sm">+ Añadir</button>
                </div>
                <div id="education-list">
                </div>
            </div>
        </aside>
        <main class="preview-panel">
            <div id="cv-paper">
            </div>
        </main>
    </div>

    <script>
        (function() {
            'use strict';

            const STORAGE_KEY = 'cv_studio_data';

            const CVStudio = {
                init: function() {
                    this.cacheDOM();
                    
                    const initialState = {
                        personalData: {
                            firstName: '',
                            lastName: '',
                            email: '',
                            phone: '',
                            website: '',
                            location: '',
                            title: '',
                            linkedin: '',
                            github: ''
                        },
                        summary: '',
                        experience: [], // Array of objects: { id: string, company: string, position: string, location: string, startDate: string, endDate: string, current: boolean, description: string }
                        education: [],  // Array of objects: { id: string, institution: string, degree: string, field: string, location: string, startDate: string, endDate: string, current: boolean, description: string }
                        skills: []      // Array of strings: ['JavaScript', 'HTML', 'CSS']
                    };

                    const savedState = this.loadFromLocalStorage();
                    const stateToUse = savedState ? this.mergeDeep(initialState, savedState) : initialState;

                    this.state = this.createReactiveState(stateToUse);
                    this.bindEvents();
                    this.syncEditorWithState();
                    this.render();
                },

                cacheDOM: function() {
                    this.app = document.getElementById('app');
                    this.preview = document.getElementById('cv-paper');
                    this.editor = document.querySelector('.editor-panel');
                    this.experienceListContainer = document.getElementById('experience-list');
                    this.addExperienceBtn = document.getElementById('add-experience');
                    this.educationListContainer = document.getElementById('education-list');
                    this.addEducationBtn = document.getElementById('add-education');
                    this.exportBtn = document.getElementById('export-data');
                    this.exportPdfBtn = document.getElementById('export-pdf');
                    this.importBtn = document.getElementById('import-data');
                    this.importInput = document.getElementById('import-input');
                },

                bindEvents: function() {
                    const self = this;
                    
                    if (this.exportBtn) {
                        this.exportBtn.addEventListener('click', () => {
                            self.exportData();
                        });
                    }

                    if (this.exportPdfBtn) {
                        this.exportPdfBtn.addEventListener('click', () => {
                            self.exportPDF();
                        });
                    }

                    if (this.importBtn) {
                        this.importBtn.addEventListener('click', () => {
                            self.importData();
                        });
                    }

                    const handleInput = (e) => {
                        const path = e.target.getAttribute('data-path');
                        if (path) {
                            const value = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
                            self.updateStateByPath(path, value);

                            if (path.includes('experience') && path.endsWith('.current')) {
                                self.renderExperienceEditor();
                            }
                            if (path.includes('education') && path.endsWith('.current')) {
                                self.renderEducationEditor();
                            }
                        }
                    };

                    this.editor.addEventListener('input', handleInput);
                    this.editor.addEventListener('change', handleInput);

                    if (this.addExperienceBtn) {
                        this.addExperienceBtn.addEventListener('click', () => {
                            self.addExperience();
                        });
                    }

                    if (this.addEducationBtn) {
                        this.addEducationBtn.addEventListener('click', () => {
                            self.addEducation();
                        });
                    }

                    if (this.experienceListContainer) {
                        this.experienceListContainer.addEventListener('click', (e) => {
                            const btn = e.target.closest('button');
                            if (!btn) return;

                            const action = btn.getAttribute('data-action');
                            const id = btn.getAttribute('data-id');

                            if (action === 'remove') {
                                self.removeExperience(id);
                            } else if (action === 'move-up') {
                                self.moveExperience(id, -1);
                            } else if (action === 'move-down') {
                                self.moveExperience(id, 1);
                            }
                        });
                    }

                    if (this.educationListContainer) {
                        this.educationListContainer.addEventListener('click', (e) => {
                            const btn = e.target.closest('button');
                            if (!btn) return;

                            const action = btn.getAttribute('data-action');
                            const id = btn.getAttribute('data-id');

                            if (action === 'remove') {
                                self.removeEducation(id);
                            } else if (action === 'move-up') {
                                self.moveEducation(id, -1);
                            } else if (action === 'move-down') {
                                self.moveEducation(id, 1);
                            }
                        });
                    }
                },

                syncEditorWithState: function() {
                    const inputs = this.editor.querySelectorAll('[data-path]');
                    inputs.forEach(input => {
                        const path = input.getAttribute('data-path');
                        if (path.startsWith('experience') || path.startsWith('education')) return;
                        
                        let value = this.getValueByPath(path);
                        if (value !== undefined) {
                            if (path === 'skills' && Array.isArray(value)) {
                                value = value.join(', ');
                            }
                            if (input.type === 'checkbox') {
                                input.checked = !!value;
                            } else {
                                input.value = value;
                            }
                        }
                    });
                    
                    this.renderExperienceEditor();
                    this.renderEducationEditor();
                },

                getValueByPath: function(path) {
                    return path.split('.').reduce((obj, key) => (obj && typeof obj[key] !== 'undefined') ? obj[key] : undefined, this.state);
                },

                updateStateByPath: function(path, value) {
                    const keys = path.split('.');
                    let current = this.state;
                    
                    for (let i = 0; i < keys.length - 1; i++) {
                        current = current[keys[i]];
                    }
                    
                    if (path === 'skills' && typeof value === 'string') {
                        current[keys[keys.length - 1]] = value.split(',').map(s => s.trim()).filter(s => s.length > 0);
                    } else {
                        current[keys[keys.length - 1]] = value;
                    }
                },

                addExperience: function() {
                    const newExp = {
                        id: Date.now().toString(),
                        company: '',
                        position: '',
                        location: '',
                        startDate: '',
                        endDate: '',
                        current: false,
                        description: ''
                    };
                    this.state.experience.push(newExp);
                    this.renderExperienceEditor();
                },

                removeExperience: function(id) {
                    const index = this.state.experience.findIndex(exp => exp.id === id);
                    if (index !== -1) {
                        this.state.experience.splice(index, 1);
                        this.renderExperienceEditor();
                    }
                },

                moveExperience: function(id, direction) {
                    const index = this.state.experience.findIndex(exp => exp.id === id);
                    if (index === -1) return;

                    const newIndex = index + direction;
                    if (newIndex < 0 || newIndex >= this.state.experience.length) return;

                    const items = [...this.state.experience];
                    const [movedItem] = items.splice(index, 1);
                    items.splice(newIndex, 0, movedItem);
                    
                    this.state.experience = items;
                    this.renderExperienceEditor();
                },

                renderExperienceEditor: function() {
                    if (!this.experienceListContainer) return;

                    const self = this;
                    this.experienceListContainer.innerHTML = '';

                    this.state.experience.forEach((exp, index) => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'experience-item';
                        itemDiv.innerHTML = `
                            <div class="experience-item-header">
                                <div class="experience-item-controls">
                                    <button class="btn btn-sm" data-action="move-up" data-id="${exp.id}" title="Subir" aria-label="Subir experiencia" ${index === 0 ? 'disabled' : ''}>↑</button>
                                    <button class="btn btn-sm" data-action="move-down" data-id="${exp.id}" title="Bajar" aria-label="Bajar experiencia" ${index === this.state.experience.length - 1 ? 'disabled' : ''}>↓</button>
                                    <button class="btn btn-danger btn-sm" data-action="remove" data-id="${exp.id}" aria-label="Eliminar experiencia">Eliminar</button>
                                </div>
                            </div>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label for="exp-company-${exp.id}">Empresa</label>
                                    <input type="text" id="exp-company-${exp.id}" data-path="experience.${index}.company" value="${exp.company}" placeholder="Ej. Google">
                                </div>
                                <div class="form-group">
                                    <label for="exp-position-${exp.id}">Puesto</label>
                                    <input type="text" id="exp-position-${exp.id}" data-path="experience.${index}.position" value="${exp.position}" placeholder="Ej. Senior Developer">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="exp-location-${exp.id}">Ubicación</label>
                                <input type="text" id="exp-location-${exp.id}" data-path="experience.${index}.location" value="${exp.location || ''}" placeholder="Ej. Madrid, España">
                            </div>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label for="exp-start-${exp.id}">Fecha Inicio</label>
                                    <input type="text" id="exp-start-${exp.id}" data-path="experience.${index}.startDate" value="${exp.startDate}" placeholder="Ej. Ene 2020">
                                </div>
                                <div class="form-group">
                                    <label for="exp-end-${exp.id}">Fecha Fin</label>
                                    <input type="text" id="exp-end-${exp.id}" data-path="experience.${index}.endDate" value="${exp.endDate}" placeholder="Ej. Actual" ${exp.current ? 'disabled' : ''}>
                                </div>
                            </div>
                            <div class="form-group checkbox-group mt-neg-sm mb-1">
                                <input type="checkbox" data-path="experience.${index}.current" id="curr-${exp.id}" ${exp.current ? 'checked' : ''}>
                                <label for="curr-${exp.id}" class="mb-0">Trabajo actual</label>
                            </div>
                            <div class="form-group">
                                <label for="exp-desc-${exp.id}">Descripción</label>
                                <textarea id="exp-desc-${exp.id}" data-path="experience.${index}.description" placeholder="Describe tus responsabilidades y logros...">${exp.description}</textarea>
                            </div>
                        `;
                        self.experienceListContainer.appendChild(itemDiv);
                    });
                },

                addEducation: function() {
                    const newEdu = {
                        id: Date.now().toString(),
                        institution: '',
                        degree: '',
                        field: '',
                        location: '',
                        startDate: '',
                        endDate: '',
                        current: false,
                        description: ''
                    };
                    this.state.education.push(newEdu);
                    this.renderEducationEditor();
                },

                removeEducation: function(id) {
                    const index = this.state.education.findIndex(edu => edu.id === id);
                    if (index !== -1) {
                        this.state.education.splice(index, 1);
                        this.renderEducationEditor();
                    }
                },

                moveEducation: function(id, direction) {
                    const index = this.state.education.findIndex(edu => edu.id === id);
                    if (index === -1) return;

                    const newIndex = index + direction;
                    if (newIndex < 0 || newIndex >= this.state.education.length) return;

                    const items = [...this.state.education];
                    const [movedItem] = items.splice(index, 1);
                    items.splice(newIndex, 0, movedItem);
                    
                    this.state.education = items;
                    this.renderEducationEditor();
                },

                renderEducationEditor: function() {
                    if (!this.educationListContainer) return;

                    const self = this;
                    this.educationListContainer.innerHTML = '';

                    this.state.education.forEach((edu, index) => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'experience-item';
                        itemDiv.innerHTML = `
                            <div class="experience-item-header">
                                <div class="experience-item-controls">
                                    <button class="btn btn-sm" data-action="move-up" data-id="${edu.id}" title="Subir" aria-label="Subir educación" ${index === 0 ? 'disabled' : ''}>↑</button>
                                    <button class="btn btn-sm" data-action="move-down" data-id="${edu.id}" title="Bajar" aria-label="Bajar educación" ${index === this.state.education.length - 1 ? 'disabled' : ''}>↓</button>
                                    <button class="btn btn-danger btn-sm" data-action="remove" data-id="${edu.id}" aria-label="Eliminar educación">Eliminar</button>
                                </div>
                            </div>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label for="edu-institution-${edu.id}">Institución</label>
                                    <input type="text" id="edu-institution-${edu.id}" data-path="education.${index}.institution" value="${edu.institution}" placeholder="Ej. Universidad Complutense">
                                </div>
                                <div class="form-group">
                                    <label for="edu-degree-${edu.id}">Titulación</label>
                                    <input type="text" id="edu-degree-${edu.id}" data-path="education.${index}.degree" value="${edu.degree}" placeholder="Ej. Grado en Ingeniería Informática">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="edu-location-${edu.id}">Ubicación</label>
                                <input type="text" id="edu-location-${edu.id}" data-path="education.${index}.location" value="${edu.location || ''}" placeholder="Ej. Madrid, España">
                            </div>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label for="edu-start-${edu.id}">Fecha Inicio</label>
                                    <input type="text" id="edu-start-${edu.id}" data-path="education.${index}.startDate" value="${edu.startDate}" placeholder="Ej. 2015">
                                </div>
                                <div class="form-group">
                                    <label for="edu-end-${edu.id}">Fecha Fin</label>
                                    <input type="text" id="edu-end-${edu.id}" data-path="education.${index}.endDate" value="${edu.endDate}" placeholder="Ej. 2019" ${edu.current ? 'disabled' : ''}>
                                </div>
                            </div>
                            <div class="form-group checkbox-group mt-neg-sm mb-1">
                                <input type="checkbox" data-path="education.${index}.current" id="curr-edu-${edu.id}" ${edu.current ? 'checked' : ''}>
                                <label for="curr-edu-${edu.id}" class="mb-0">Cursando actualmente</label>
                            </div>
                            <div class="form-group">
                                <label for="edu-desc-${edu.id}">Descripción (Opcional)</label>
                                <textarea id="edu-desc-${edu.id}" data-path="education.${index}.description" placeholder="Describe logros académicos, proyectos destacados...">${edu.description}</textarea>
                            </div>
                        `;
                        self.educationListContainer.appendChild(itemDiv);
                    });
                },

                createReactiveState: function(initialState) {
                    const self = this;
                    const proxiedObjects = new WeakMap();

                    const createProxy = (obj) => {
                        if (proxiedObjects.has(obj)) {
                            return proxiedObjects.get(obj);
                        }

                        const handler = {
                            get(target, key) {
                                const value = target[key];
                                if (typeof value === 'object' && value !== null) {
                                    return createProxy(value);
                                }
                                return value;
                            },
                            set(target, key, value) {
                                if (target[key] === value) return true;
                                target[key] = value;
                                self.render();
                                self.debouncedSave();
                                return true;
                            },
                            deleteProperty(target, key) {
                                const deleted = delete target[key];
                                if (deleted) {
                                    self.render();
                                    self.debouncedSave();
                                }
                                return deleted;
                            }
                        };

                        const proxy = new Proxy(obj, handler);
                        proxiedObjects.set(obj, proxy);
                        return proxy;
                    };

                    return createProxy(initialState);
                },

                render: function() {
                    if (!this.preview) return;
                    
                    const { personalData, summary, experience, education, skills } = this.state;
                    
                    let summaryHtml = '';
                    if (summary && summary.trim().length > 0) {
                        summaryHtml = `
                            <div class="cv-section">
                                <h2 class="cv-section-title">Perfil Profesional</h2>
                                <p class="cv-summary">${summary}</p>
                            </div>
                        `;
                    }

                    let experienceHtml = '';
                    if (experience && experience.length > 0) {
                        experienceHtml = `
                            <div class="cv-section">
                                <h2 class="cv-section-title">Experiencia Laboral</h2>
                                ${experience.map(exp => `
                                    <div class="cv-item">
                                        <div class="cv-item-header">
                                            <span class="cv-item-title">${exp.position || 'Puesto'}</span>
                                            <span class="cv-item-date">${exp.startDate || ''} ${exp.startDate && (exp.endDate || exp.current) ? '—' : ''} ${exp.current ? 'Actual' : (exp.endDate || '')}</span>
                                        </div>
                                        <div class="cv-item-subtitle">${exp.company || ''}${exp.company && exp.location ? ' | ' : ''}${exp.location || ''}</div>
                                        ${exp.description ? `<p class="cv-item-description">${exp.description}</p>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                    let educationHtml = '';
                    if (education && education.length > 0) {
                        educationHtml = `
                            <div class="cv-section">
                                <h2 class="cv-section-title">Educación</h2>
                                ${education.map(edu => `
                                    <div class="cv-item">
                                        <div class="cv-item-header">
                                            <span class="cv-item-title">${edu.degree || 'Titulación'}</span>
                                            <span class="cv-item-date">${edu.startDate || ''} ${edu.startDate && (edu.endDate || edu.current) ? '—' : ''} ${edu.current ? 'Actual' : (edu.endDate || '')}</span>
                                        </div>
                                        <div class="cv-item-subtitle">${edu.institution || ''}${edu.institution && edu.location ? ' | ' : ''}${edu.location || ''}</div>
                                        ${edu.description ? `<p class="cv-item-description">${edu.description}</p>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                    let skillsHtml = '';
                    const skillList = Array.isArray(skills) ? skills : (typeof skills === 'string' ? skills.split(',').map(s => s.trim()).filter(s => s.length > 0) : []);
                    if (skillList.length > 0) {
                        skillsHtml = `
                            <div class="cv-section">
                                <h2 class="cv-section-title">Habilidades</h2>
                                <div class="cv-skills">
                                    ${skillList.map(skill => `<span class="cv-skill-tag">${skill}</span>`).join('')}
                                </div>
                            </div>
                        `;
                    }

                    const contactItems = [
                        { icon: '📧', value: personalData.email },
                        { icon: '📱', value: personalData.phone },
                        { icon: '📍', value: personalData.location },
                        { icon: '🔗', value: personalData.linkedin },
                        { icon: '💻', value: personalData.github },
                        { icon: '🌐', value: personalData.website }
                    ].filter(item => item.value);

                    let contactHtml = '';
                    if (contactItems.length > 0) {
                        contactHtml = `
                            <div class="cv-section">
                                <h2 class="cv-section-title">Contacto</h2>
                                <ul class="cv-contact-list">
                                    ${contactItems.map(item => `
                                        <li>
                                            <span class="cv-contact-icon">${item.icon}</span>
                                            <span class="cv-contact-value">${item.value}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        `;
                    }

                    this.preview.innerHTML = `
                        <header class="cv-header">
                            <h1>${personalData.firstName || 'Tu'} <strong>${personalData.lastName || 'Nombre'}</strong></h1>
                            <p class="cv-title">${personalData.title || 'Tu Profesión'}</p>
                        </header>
                        
                        <div class="cv-grid">
                            <div class="cv-main-col">
                                ${summaryHtml}
                                ${experienceHtml}
                                ${educationHtml}
                            </div>
                            
                            <aside class="cv-sidebar">
                                ${contactHtml}
                                ${skillsHtml}
                            </aside>
                        </div>
                    `;

                    // JSON data for portability and import/export
                    const dataScript = document.createElement('script');
                    dataScript.id = 'cv-data';
                    dataScript.type = 'application/json';
                    dataScript.textContent = JSON.stringify(this.state);
                    this.preview.appendChild(dataScript);
                },

                exportData: function() {
                    const dataStr = JSON.stringify(this.state, null, 2);
                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `cv-data-${Date.now()}.json`;
                    document.body.appendChild(link);
                    link.click();
                    
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                },

                exportPDF: function() {
                    window.print();
                },

                importData: function() {
                    const self = this;
                    if (!this.importInput) return;

                    this.importInput.onchange = (e) => {
                        const file = e.target.files[0];
                        if (!file) return;

                        const reader = new FileReader();
                        reader.onload = (event) => {
                            try {
                                const importedData = JSON.parse(event.target.result);
                                const validation = self.validateData(importedData);

                                if (validation.valid) {
                                    // Mezclamos con el estado inicial para asegurar estructura
                                    // Para simplificar, actualizamos las propiedades principales directamente
                                    Object.keys(importedData).forEach(key => {
                                        if (Object.prototype.hasOwnProperty.call(self.state, key)) {
                                            self.state[key] = importedData[key];
                                        }
                                    });
                                    
                                    self.syncEditorWithState();
                                    self.render();
                                    alert('Datos importados correctamente.');
                                } else {
                                    alert(`Error en la estructura del archivo: ${validation.error}`);
                                }
                            } catch {
                                alert('Error al procesar el archivo. Asegúrate de que sea un JSON válido.');
                            }
                            self.importInput.value = '';
                        };
                        reader.readAsText(file);
                    };

                    this.importInput.click();
                },

                validateData: function(data) {
                    if (!data || typeof data !== 'object' || Array.isArray(data)) {
                        return { valid: false, error: 'Los datos deben ser un objeto JSON.' };
                    }

                    const requiredSections = ['personalData', 'summary', 'experience', 'education', 'skills'];
                    for (const section of requiredSections) {
                        if (!(section in data)) {
                            return { valid: false, error: `Falta la sección obligatoria: ${section}` };
                        }
                    }

                    if (!this.isObject(data.personalData)) {
                        return { valid: false, error: 'La sección personalData debe ser un objeto.' };
                    }

                    if (!Array.isArray(data.experience)) {
                        return { valid: false, error: 'La sección experience debe ser un array.' };
                    }

                    if (!Array.isArray(data.education)) {
                        return { valid: false, error: 'La sección education debe ser un array.' };
                    }

                    if (!Array.isArray(data.skills)) {
                        return { valid: false, error: 'La sección skills debe ser un array.' };
                    }

                    return { valid: true };
                },

                saveToLocalStorage: function() {
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
                    } catch {
                        /* Ignore */
                    }
                },

                loadFromLocalStorage: function() {
                    try {
                        const saved = localStorage.getItem(STORAGE_KEY);
                        return saved ? JSON.parse(saved) : null;
                    } catch {
                        return null;
                    }
                },

                debounce: function(func, wait) {
                    let timeout;
                    return function executedFunction(...args) {
                        const later = () => {
                            clearTimeout(timeout);
                            func.apply(this, args);
                        };
                        clearTimeout(timeout);
                        timeout = setTimeout(later, wait);
                    };
                },

                debouncedSave: null,

                /**
                 * Utilidad para mezclar objetos de forma profunda
                 */
                mergeDeep: function(target, source) {
                    if (!this.isObject(target) || !this.isObject(source)) {
                        return source;
                    }

                    const output = Object.assign({}, target);
                    Object.keys(source).forEach(key => {
                        const targetValue = target[key];
                        const sourceValue = source[key];

                        if (this.isObject(targetValue) && this.isObject(sourceValue)) {
                            output[key] = this.mergeDeep(targetValue, sourceValue);
                        } else {
                            output[key] = sourceValue;
                        }
                    });
                    return output;
                },

                isObject: function(item) {
                    return (item && typeof item === 'object' && !Array.isArray(item));
                }
            };

            CVStudio.debouncedSave = CVStudio.debounce(CVStudio.saveToLocalStorage.bind(CVStudio), 500);

            document.addEventListener('DOMContentLoaded', () => {
                CVStudio.init();
            });
        })();
    </script>
</body>
