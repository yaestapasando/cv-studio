<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Studio - Generador de CV</title>
    <style>
        /* Variables y Estilos Base */
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg-editor: #f8fafc;
            --bg-preview: #cbd5e1;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --white: #fff;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 10%), 0 4px 6px -4px rgb(0 0 0 / 10%);
            
            /* Tipografía y Espaciado CV */
            --cv-font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --cv-font-serif: 'Georgia', serif;
            --cv-spacing-sm: 0.5rem;
            --cv-spacing-md: 1rem;
            --cv-spacing-lg: 1.5rem;
            
            /* Dimensiones Hoja A4 */
            --a4-width: 210mm;
            --a4-height: 297mm;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--cv-font-sans);
            background-color: var(--bg-preview);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100%;
        }

        /* Paneles Principales */
        .editor-panel {
            flex: 0 0 40%;
            background: var(--bg-editor);
            overflow-y: auto;
            padding: 2rem;
            border-right: 1px solid #e2e8f0;
            z-index: 10;
        }

        .preview-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 3rem 1rem;
            background: var(--bg-preview);
            scroll-behavior: smooth;
        }

        /* Hoja de CV */
        #cv-paper {
            background: var(--white);
            width: 100%;
            max-width: var(--a4-width);
            min-height: var(--a4-height);
            aspect-ratio: 210 / 297;
            padding: 40px;
            box-shadow: var(--shadow);
            margin: 0 auto;
        }

        /* Diseño Responsive */
        @media (width <= 1024px) {
            #app {
                flex-direction: column;
                overflow-y: auto;
            }

            body {
                overflow: auto;
            }

            .editor-panel {
                flex: none;
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e2e8f0;
            }

            .preview-panel {
                padding: 1rem;
            }

            #cv-paper {
                width: 95%;
                min-height: auto;
                aspect-ratio: auto;
                padding: 20px;
            }
        }

        /* Estilos para impresión */
        @media print {
            .editor-panel {
                display: none;
            }

            .preview-panel {
                padding: 0;
                background: none;
                display: block;
            }

            #cv-paper {
                box-shadow: none;
                margin: 0;
                width: 100%;
            }

            body, #app {
                height: auto;
                overflow: visible;
            }
        }

        /* Estilos del Editor */
        .editor-panel h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .form-section {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .form-section h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-editor);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Estilos de la Vista Previa (CV) */
        .cv-header h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cv-title {
            font-size: 1.25rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .cv-section {
            margin-top: 1.5rem;
            line-height: 1.6;
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div id="app">
        <aside class="editor-panel">
            <h1>Configuración de CV</h1>
            <div class="form-section">
                <h2>Datos Personales</h2>
                <div class="form-group">
                    <label for="firstName">Nombre</label>
                    <input type="text" id="firstName" data-path="personalData.firstName" placeholder="Ej. Juan">
                </div>
                <div class="form-group">
                    <label for="lastName">Apellido</label>
                    <input type="text" id="lastName" data-path="personalData.lastName" placeholder="Ej. Pérez">
                </div>
                <div class="form-group">
                    <label for="title">Profesión</label>
                    <input type="text" id="title" data-path="personalData.title" placeholder="Ej. Desarrollador Fullstack">
                </div>
            </div>
            <div class="form-section">
                <h2>Resumen Profesional</h2>
                <div class="form-group">
                    <textarea id="summary" data-path="summary" placeholder="Cuéntanos sobre ti..."></textarea>
                </div>
            </div>
        </aside>
        <main class="preview-panel">
            <div id="cv-paper">
                <!-- Vista previa en Feature 4 -->
            </div>
        </main>
    </div>

    <script>
        /**
         * CV Studio - Script Principal
         * Aplicación Single-File para generación de CVs.
         */
        (function() {
            'use strict';

            const CVStudio = {
                init: function() {
                    console.info('CV Studio: Inicializando aplicación...');
                    this.cacheDOM();
                    this.state = this.createReactiveState({
                        personalData: {
                            firstName: '',
                            lastName: '',
                            email: '',
                            phone: '',
                            website: '',
                            location: '',
                            title: '',
                            linkedin: '',
                            github: ''
                        },
                        summary: '',
                        experience: [], // Array of objects: { id: string, company: string, position: string, location: string, startDate: string, endDate: string, current: boolean, description: string }
                        education: [],  // Array of objects: { id: string, institution: string, degree: string, field: string, location: string, startDate: string, endDate: string, current: boolean, description: string }
                        skills: []      // Array of strings: ['JavaScript', 'HTML', 'CSS']
                    });
                    this.bindEvents();
                    this.render();
                },

                cacheDOM: function() {
                    this.app = document.getElementById('app');
                    this.preview = document.getElementById('cv-paper');
                    this.editor = document.querySelector('.editor-panel');
                },

                bindEvents: function() {
                    const self = this;
                    
                    // Escuchar cambios en los inputs del editor
                    this.editor.addEventListener('input', (e) => {
                        const path = e.target.getAttribute('data-path');
                        if (path) {
                            self.updateStateByPath(path, e.target.value);
                        }
                    });
                },

                /**
                 * Actualiza una propiedad del estado basándose en una cadena de ruta (ej: 'personalData.firstName')
                 */
                updateStateByPath: function(path, value) {
                    const keys = path.split('.');
                    let current = this.state;
                    
                    for (let i = 0; i < keys.length - 1; i++) {
                        current = current[keys[i]];
                    }
                    
                    current[keys[keys.length - 1]] = value;
                },

                createReactiveState: function(initialState) {
                    const self = this;
                    const proxiedObjects = new WeakMap();

                    const createProxy = (obj) => {
                        if (proxiedObjects.has(obj)) {
                            return proxiedObjects.get(obj);
                        }

                        const handler = {
                            get(target, key) {
                                const value = target[key];
                                if (typeof value === 'object' && value !== null) {
                                    return createProxy(value);
                                }
                                return value;
                            },
                            set(target, key, value) {
                                if (target[key] === value) return true;
                                target[key] = value;
                                self.render();
                                return true;
                            },
                            deleteProperty(target, key) {
                                const deleted = delete target[key];
                                if (deleted) {
                                    self.render();
                                }
                                return deleted;
                            }
                        };

                        const proxy = new Proxy(obj, handler);
                        proxiedObjects.set(obj, proxy);
                        return proxy;
                    };

                    return createProxy(initialState);
                },

                render: function() {
                    console.debug('CV Studio: Renderizando vista previa...');
                    if (!this.preview) return;
                    
                    const { personalData, summary } = this.state;
                    
                    // Renderizado básico para validar reactividad
                    this.preview.innerHTML = `
                        <div class="cv-header">
                            <h1>${personalData.firstName || 'Tu Nombre'} ${personalData.lastName || ''}</h1>
                            <p class="cv-title">${personalData.title || 'Tu Profesión'}</p>
                        </div>
                        <div class="cv-section">
                            <p>${summary || 'Escribe aquí tu resumen profesional...'}</p>
                        </div>
                    `;
                },

                // Feature 2: Gestión del Estado
                state: null
            };

            // Iniciar aplicación al cargar el DOM
            document.addEventListener('DOMContentLoaded', () => {
                CVStudio.init();
            });
        })();
    </script>
</body>
</html>
