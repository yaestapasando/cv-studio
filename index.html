<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Studio - Generador de CV</title>
    <style>
        /* Variables y Estilos Base */
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg-editor: #f8fafc;
            --bg-preview: #cbd5e1;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --white: #fff;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 10%), 0 4px 6px -4px rgb(0 0 0 / 10%);
            
            /* Tipografía y Espaciado CV */
            --cv-font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --cv-font-serif: 'Georgia', serif;
            --cv-spacing-sm: 0.5rem;
            --cv-spacing-md: 1rem;
            --cv-spacing-lg: 1.5rem;
            
            /* Dimensiones Hoja A4 */
            --a4-width: 210mm;
            --a4-height: 297mm;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--cv-font-sans);
            background-color: var(--bg-preview);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100%;
        }

        /* Paneles Principales */
        .editor-panel {
            flex: 0 0 40%;
            background: var(--bg-editor);
            overflow-y: auto;
            padding: 2rem;
            border-right: 1px solid #e2e8f0;
            z-index: 10;
        }

        .preview-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 3rem 1rem;
            background: var(--bg-preview);
            scroll-behavior: smooth;
        }

        /* Hoja de CV */
        #cv-paper {
            background: var(--white);
            width: 100%;
            max-width: var(--a4-width);
            min-height: var(--a4-height);
            aspect-ratio: 210 / 297;
            padding: 40px;
            box-shadow: var(--shadow);
            margin: 0 auto;
        }

        /* Diseño Responsive */
        @media (width <= 1024px) {
            #app {
                flex-direction: column;
                overflow-y: auto;
            }

            body {
                overflow: auto;
            }

            .editor-panel {
                flex: none;
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e2e8f0;
            }

            .preview-panel {
                padding: 1rem;
            }

            #cv-paper {
                width: 95%;
                min-height: auto;
                aspect-ratio: auto;
                padding: 20px;
            }
        }

        /* Estilos para impresión */
        @media print {
            .editor-panel {
                display: none;
            }

            .preview-panel {
                padding: 0;
                background: none;
                display: block;
            }

            #cv-paper {
                box-shadow: none;
                margin: 0;
                width: 100%;
            }

            body, #app {
                height: auto;
                overflow: visible;
            }
        }

        /* Estilos del Editor */
        .editor-panel h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .form-section {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .form-section h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-editor);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mb-0 { margin-bottom: 0 !important; }
        .mb-1 { margin-bottom: 1rem !important; }
        .mt-neg-sm { margin-top: -0.5rem !important; }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input {
            width: auto !important;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Botones y Acciones */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
        }

        .btn-full {
            width: 100%;
        }

        .experience-item {
            background: var(--bg-editor);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .experience-item-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.5rem;
        }

        .experience-item-controls {
            display: flex;
            gap: 0.5rem;
        }

        @media (width <= 640px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        /* Estilos de la Vista Previa (CV) */
        .cv-header h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cv-title {
            font-size: 1.25rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .cv-contact {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .cv-section {
            margin-top: 1.5rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        .cv-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.25rem;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cv-item {
            margin-bottom: 1rem;
        }

        .cv-item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.25rem;
        }

        .cv-item-title {
            font-weight: 700;
            font-size: 1rem;
        }

        .cv-item-subtitle {
            font-weight: 600;
            color: var(--text-main);
        }

        .cv-item-date {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: right;
            min-width: 120px;
        }

        .cv-item-description {
            font-size: 0.9rem;
            white-space: pre-line;
        }

        .cv-summary {
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <div id="app">
        <aside class="editor-panel">
            <h1>Configuración de CV</h1>
            <div class="form-section">
                <h2>Datos Personales</h2>
                <div class="form-group">
                    <label for="firstName">Nombre</label>
                    <input type="text" id="firstName" data-path="personalData.firstName" placeholder="Ej. Juan">
                </div>
                <div class="form-group">
                    <label for="lastName">Apellido</label>
                    <input type="text" id="lastName" data-path="personalData.lastName" placeholder="Ej. Pérez">
                </div>
                <div class="form-group">
                    <label for="title">Profesión</label>
                    <input type="text" id="title" data-path="personalData.title" placeholder="Ej. Desarrollador Fullstack">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" data-path="personalData.email" placeholder="Ej. juan.perez@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" data-path="personalData.phone" placeholder="Ej. +34 600 000 000">
                </div>
                <div class="form-group">
                    <label for="location">Ubicación</label>
                    <input type="text" id="location" data-path="personalData.location" placeholder="Ej. Madrid, España">
                </div>
                <div class="form-group">
                    <label for="linkedin">LinkedIn</label>
                    <input type="url" id="linkedin" data-path="personalData.linkedin" placeholder="Ej. linkedin.com/in/juanperez">
                </div>
                <div class="form-group">
                    <label for="github">GitHub</label>
                    <input type="url" id="github" data-path="personalData.github" placeholder="Ej. github.com/juanperez">
                </div>
                <div class="form-group">
                    <label for="website">Sitio Web</label>
                    <input type="url" id="website" data-path="personalData.website" placeholder="Ej. juanperez.dev">
                </div>
            </div>
            <div class="form-section">
                <h2>Extracto / Perfil Profesional</h2>
                <div class="form-group">
                    <label for="summary">Descripción</label>
                    <textarea id="summary" data-path="summary" placeholder="Breve descripción de tu perfil profesional, objetivos y logros principales..."></textarea>
                </div>
            </div>
            <div class="form-section">
                <div class="flex-between mb-1">
                    <h2 class="mb-0">Experiencia Laboral</h2>
                    <button type="button" id="add-experience" class="btn btn-primary btn-sm">+ Añadir</button>
                </div>
                <div id="experience-list">
                    <!-- Dinámico -->
                </div>
            </div>
        </aside>
        <main class="preview-panel">
            <div id="cv-paper">
                <!-- Vista previa en Feature 4 -->
            </div>
        </main>
    </div>

    <script>
        /**
         * CV Studio - Script Principal
         * Aplicación Single-File para generación de CVs.
         */
        (function() {
            'use strict';

            const STORAGE_KEY = 'cv_studio_data';

            const CVStudio = {
                init: function() {
                    console.info('CV Studio: Inicializando aplicación...');
                    this.cacheDOM();
                    
                    const initialState = {
                        personalData: {
                            firstName: '',
                            lastName: '',
                            email: '',
                            phone: '',
                            website: '',
                            location: '',
                            title: '',
                            linkedin: '',
                            github: ''
                        },
                        summary: '',
                        experience: [], // Array of objects: { id: string, company: string, position: string, location: string, startDate: string, endDate: string, current: boolean, description: string }
                        education: [],  // Array of objects: { id: string, institution: string, degree: string, field: string, location: string, startDate: string, endDate: string, current: boolean, description: string }
                        skills: []      // Array of strings: ['JavaScript', 'HTML', 'CSS']
                    };

                    const savedState = this.loadFromLocalStorage();
                    const stateToUse = savedState ? this.mergeDeep(initialState, savedState) : initialState;

                    this.state = this.createReactiveState(stateToUse);
                    this.bindEvents();
                    this.syncEditorWithState();
                    this.render();
                },

                cacheDOM: function() {
                    this.app = document.getElementById('app');
                    this.preview = document.getElementById('cv-paper');
                    this.editor = document.querySelector('.editor-panel');
                    this.experienceListContainer = document.getElementById('experience-list');
                    this.addExperienceBtn = document.getElementById('add-experience');
                },

                bindEvents: function() {
                    const self = this;
                    
                    // Escuchar cambios en los inputs del editor
                    this.editor.addEventListener('input', (e) => {
                        const path = e.target.getAttribute('data-path');
                        if (path) {
                            const value = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
                            self.updateStateByPath(path, value);

                            // Si cambió 'current', necesitamos refrescar el editor para habilitar/deshabilitar el campo fecha fin
                            if (path.includes('experience') && path.endsWith('.current')) {
                                self.renderExperienceEditor();
                            }
                        }
                    });

                    // Botón añadir experiencia
                    if (this.addExperienceBtn) {
                        this.addExperienceBtn.addEventListener('click', () => {
                            self.addExperience();
                        });
                    }

                    // Botones en el editor (remover, reordenar)
                    if (this.experienceListContainer) {
                        this.experienceListContainer.addEventListener('click', (e) => {
                            const btn = e.target.closest('button');
                            if (!btn) return;

                            const action = btn.getAttribute('data-action');
                            const id = btn.getAttribute('data-id');

                            if (action === 'remove') {
                                self.removeExperience(id);
                            } else if (action === 'move-up') {
                                self.moveExperience(id, -1);
                            } else if (action === 'move-down') {
                                self.moveExperience(id, 1);
                            }
                        });
                    }
                },

                /**
                 * Sincroniza los campos del editor con el estado cargado
                 */
                syncEditorWithState: function() {
                    const inputs = this.editor.querySelectorAll('[data-path]');
                    inputs.forEach(input => {
                        const path = input.getAttribute('data-path');
                        // No sincronizamos automáticamente campos de listas dinámicas aquí, 
                        // ya que se renderizan bajo demanda
                        if (path.startsWith('experience')) return;
                        
                        const value = this.getValueByPath(path);
                        if (value !== undefined) {
                            if (input.type === 'checkbox') {
                                input.checked = !!value;
                            } else {
                                input.value = value;
                            }
                        }
                    });
                    
                    this.renderExperienceEditor();
                },

                /**
                 * Obtiene un valor del estado basándose en una cadena de ruta
                 */
                getValueByPath: function(path) {
                    return path.split('.').reduce((obj, key) => (obj && typeof obj[key] !== 'undefined') ? obj[key] : undefined, this.state);
                },

                /**
                 * Actualiza una propiedad del estado basándose en una cadena de ruta (ej: 'personalData.firstName')
                 */
                updateStateByPath: function(path, value) {
                    const keys = path.split('.');
                    let current = this.state;
                    
                    for (let i = 0; i < keys.length - 1; i++) {
                        // Si la siguiente clave es un índice de array (número), nos aseguramos de que el actual sea el array
                        current = current[keys[i]];
                    }
                    
                    current[keys[keys.length - 1]] = value;
                },

                addExperience: function() {
                    const newExp = {
                        id: Date.now().toString(),
                        company: '',
                        position: '',
                        location: '',
                        startDate: '',
                        endDate: '',
                        current: false,
                        description: ''
                    };
                    this.state.experience.push(newExp);
                    this.renderExperienceEditor();
                },

                removeExperience: function(id) {
                    const index = this.state.experience.findIndex(exp => exp.id === id);
                    if (index !== -1) {
                        this.state.experience.splice(index, 1);
                        this.renderExperienceEditor();
                    }
                },

                moveExperience: function(id, direction) {
                    const index = this.state.experience.findIndex(exp => exp.id === id);
                    if (index === -1) return;

                    const newIndex = index + direction;
                    if (newIndex < 0 || newIndex >= this.state.experience.length) return;

                    const items = [...this.state.experience];
                    const [movedItem] = items.splice(index, 1);
                    items.splice(newIndex, 0, movedItem);
                    
                    // Reemplazamos el array completo para disparar la reactividad adecuadamente
                    this.state.experience = items;
                    this.renderExperienceEditor();
                },

                renderExperienceEditor: function() {
                    if (!this.experienceListContainer) return;

                    const self = this;
                    this.experienceListContainer.innerHTML = '';

                    this.state.experience.forEach((exp, index) => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'experience-item';
                        itemDiv.innerHTML = `
                            <div class="experience-item-header">
                                <div class="experience-item-controls">
                                    <button class="btn btn-sm" data-action="move-up" data-id="${exp.id}" title="Subir" ${index === 0 ? 'disabled' : ''}>↑</button>
                                    <button class="btn btn-sm" data-action="move-down" data-id="${exp.id}" title="Bajar" ${index === this.state.experience.length - 1 ? 'disabled' : ''}>↓</button>
                                    <button class="btn btn-danger btn-sm" data-action="remove" data-id="${exp.id}">Eliminar</button>
                                </div>
                            </div>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label>Empresa</label>
                                    <input type="text" data-path="experience.${index}.company" value="${exp.company}" placeholder="Ej. Google">
                                </div>
                                <div class="form-group">
                                    <label>Puesto</label>
                                    <input type="text" data-path="experience.${index}.position" value="${exp.position}" placeholder="Ej. Senior Developer">
                                </div>
                            </div>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label>Fecha Inicio</label>
                                    <input type="text" data-path="experience.${index}.startDate" value="${exp.startDate}" placeholder="Ej. Ene 2020">
                                </div>
                                <div class="form-group">
                                    <label>Fecha Fin</label>
                                    <input type="text" data-path="experience.${index}.endDate" value="${exp.endDate}" placeholder="Ej. Actual" ${exp.current ? 'disabled' : ''}>
                                </div>
                            </div>
                            <div class="form-group checkbox-group mt-neg-sm mb-1">
                                <input type="checkbox" data-path="experience.${index}.current" id="curr-${exp.id}" ${exp.current ? 'checked' : ''}>
                                <label for="curr-${exp.id}" class="mb-0">Trabajo actual</label>
                            </div>
                            <div class="form-group">
                                <label>Descripción</label>
                                <textarea data-path="experience.${index}.description" placeholder="Describe tus responsabilidades y logros...">${exp.description}</textarea>
                            </div>
                        `;
                        self.experienceListContainer.appendChild(itemDiv);
                    });
                },

                createReactiveState: function(initialState) {
                    const self = this;
                    const proxiedObjects = new WeakMap();

                    const createProxy = (obj) => {
                        if (proxiedObjects.has(obj)) {
                            return proxiedObjects.get(obj);
                        }

                        const handler = {
                            get(target, key) {
                                const value = target[key];
                                if (typeof value === 'object' && value !== null) {
                                    return createProxy(value);
                                }
                                return value;
                            },
                            set(target, key, value) {
                                if (target[key] === value) return true;
                                target[key] = value;
                                self.render();
                                self.debouncedSave();
                                return true;
                            },
                            deleteProperty(target, key) {
                                const deleted = delete target[key];
                                if (deleted) {
                                    self.render();
                                    self.debouncedSave();
                                }
                                return deleted;
                            }
                        };

                        const proxy = new Proxy(obj, handler);
                        proxiedObjects.set(obj, proxy);
                        return proxy;
                    };

                    return createProxy(initialState);
                },

                render: function() {
                    console.debug('CV Studio: Renderizando vista previa...');
                    if (!this.preview) return;
                    
                    const { personalData, summary, experience } = this.state;
                    
                    let experienceHtml = '';
                    if (experience && experience.length > 0) {
                        experienceHtml = `
                            <div class="cv-section">
                                <h2 class="cv-section-title">Experiencia Laboral</h2>
                                ${experience.map(exp => `
                                    <div class="cv-item">
                                        <div class="cv-item-header">
                                            <div>
                                                <span class="cv-item-title">${exp.position || 'Puesto'}</span>
                                                ${exp.company ? ` | <span class="cv-item-subtitle">${exp.company}</span>` : ''}
                                            </div>
                                            <div class="cv-item-date">
                                                ${exp.startDate || ''} ${exp.startDate || (exp.endDate || exp.current) ? '-' : ''} ${exp.current ? 'Actual' : (exp.endDate || '')}
                                            </div>
                                        </div>
                                        ${exp.description ? `<p class="cv-item-description">${exp.description}</p>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                    // Renderizado básico para validar reactividad
                    this.preview.innerHTML = `
                        <div class="cv-header">
                            <h1>${personalData.firstName || 'Tu Nombre'} ${personalData.lastName || ''}</h1>
                            <p class="cv-title">${personalData.title || 'Tu Profesión'}</p>
                            <div class="cv-contact">
                                ${personalData.email ? `<span>${personalData.email}</span>` : ''}
                                ${personalData.phone ? `<span> | ${personalData.phone}</span>` : ''}
                                ${personalData.location ? `<span> | ${personalData.location}</span>` : ''}
                                ${personalData.linkedin ? `<span> | ${personalData.linkedin}</span>` : ''}
                                ${personalData.github ? `<span> | ${personalData.github}</span>` : ''}
                                ${personalData.website ? `<span> | ${personalData.website}</span>` : ''}
                            </div>
                        </div>
                        <div class="cv-section">
                            <h2 class="cv-section-title">Perfil Profesional</h2>
                            <p class="cv-summary">${summary || 'Breve descripción de tu perfil profesional, objetivos y logros principales...'}</p>
                        </div>
                        ${experienceHtml}
                    `;
                },

                // Persistencia
                saveToLocalStorage: function() {
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
                        console.debug('CV Studio: Estado guardado en localStorage');
                    } catch (error) {
                        console.error('CV Studio: Error al guardar en localStorage', error);
                    }
                },

                loadFromLocalStorage: function() {
                    try {
                        const saved = localStorage.getItem(STORAGE_KEY);
                        return saved ? JSON.parse(saved) : null;
                    } catch (error) {
                        console.error('CV Studio: Error al cargar de localStorage', error);
                        return null;
                    }
                },

                debounce: function(func, wait) {
                    let timeout;
                    return function executedFunction(...args) {
                        const later = () => {
                            clearTimeout(timeout);
                            func.apply(this, args);
                        };
                        clearTimeout(timeout);
                        timeout = setTimeout(later, wait);
                    };
                },

                debouncedSave: null,

                /**
                 * Utilidad para mezclar objetos de forma profunda
                 */
                mergeDeep: function(target, source) {
                    if (!this.isObject(target) || !this.isObject(source)) {
                        return source;
                    }

                    const output = Object.assign({}, target);
                    Object.keys(source).forEach(key => {
                        const targetValue = target[key];
                        const sourceValue = source[key];

                        if (this.isObject(targetValue) && this.isObject(sourceValue)) {
                            output[key] = this.mergeDeep(targetValue, sourceValue);
                        } else {
                            output[key] = sourceValue;
                        }
                    });
                    return output;
                },

                isObject: function(item) {
                    return (item && typeof item === 'object' && !Array.isArray(item));
                }
            };

            // Inicializar el guardado con debounce (500ms)
            CVStudio.debouncedSave = CVStudio.debounce(CVStudio.saveToLocalStorage.bind(CVStudio), 500);

            // Iniciar aplicación al cargar el DOM
            document.addEventListener('DOMContentLoaded', () => {
                CVStudio.init();
